name: pdf_studio
description: "Convert images to PDF, edit, annotate, merge and split PDFs."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Navigation
  go_router: ^15.1.2

  # PDF generation & manipulation
  pdf: ^3.11.3
  pdf_manipulator: ^0.5.9

  # PDF viewing
  pdfx: ^2.6.0

  # Image picking
  image_picker: ^1.1.2

  # Image processing
  image: ^4.2.0

  # Reorderable grid
  flutter_reorderable_grid_view: ^5.7.0

  # File management
  path_provider: ^2.1.5
  file_picker: ^9.0.2
  share_plus: ^10.1.4

  # Permissions
  permission_handler: ^11.4.0

  # Persistent storage
  shared_preferences: ^2.3.5
  uuid: ^4.5.1

  # Utilities
  intl: ^0.20.2
  bloc_test: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

